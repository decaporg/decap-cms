backend:
  name: test-repo

site_url: https://example.com

publish_mode: editorial_workflow
media_folder: assets/uploads

# Every locale of an entry lives in one file, keyed by locale. The test backend this demo
# runs on pages its file listing 10 files at a time and groups i18n entries per page, so a
# multiple_folders collection whose locale files straddle a page boundary would not merge.
i18n:
  structure: single_file
  locales: [en, es, fr]
  default_locale: en

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 2000
  height: null
  aspect_ratio: null

logo:
  src: /nf-logo.png
  show_in_header: true

slug:
  encoding: unicode
  clean_accents: true

editor:
  notes: true

collections: # A list of collections the CMS should be able to edit
  - name: 'posts' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'Blog Posts' # Used in the UI
    label_singular: 'Post' # Used in the UI, ie: "New Post"
    description: >
      Articles about Decap CMS and static site publishing. Shows a slug template, a summary
      transform, sortable_fields, and view_filters/view_groups driven by real fields
      (Category and Featured) rather than test flags.
    folder: '_posts'
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} -- {{year}}/{{month}}/{{day}}'
    create: true # Allow users to create new documents in this collection
    editor:
      visualEditing: true
    sortable_fields:
      - title
      - { field: date, default_sort: desc }
    view_filters:
      - { label: 'Tutorials', field: category, pattern: 'Tutorial' }
      - { label: 'Release Notes', field: category, pattern: 'Release Notes' }
      - { label: 'Featured', field: featured, pattern: true }
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
      - { label: 'Category', field: category }
      - { label: 'Featured', field: featured }
    fields: # The fields each document in this collection have
      - { label: 'Title', name: 'title', widget: 'string', tagname: 'h1' }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          format: 'YYYY-MM-DD HH:mm',
          default: '{{now}}',
        }
      - label: 'Category'
        name: 'category'
        widget: 'select'
        required: false
        default: 'Tutorial'
        options: ['Tutorial', 'Release Notes', 'Case Study', 'Opinion']
      - {
          label: 'Featured',
          name: 'featured',
          widget: 'boolean',
          required: false,
          default: false,
          hint: 'Featured posts are pinned to the top of the blog index.',
        }
      - label: 'Cover Image'
        name: 'image'
        widget: 'image'
        required: false
        tagname: ''

      - { label: 'Body', name: 'body', widget: 'richtext', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold', widget: 'markdown', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold2', widget: 'markdown', hint: 'Main content goes here 2.' }

  - name: 'writers'
    label: 'Writers'
    label_singular: 'Writer'
    description: >
      This collection is a list of writers.
    folder: '_writers'
    create: true
    identifier_field: name
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Country', name: 'country', widget: 'string', required: false }
      - { label: 'Born', name: 'born', widget: 'number', required: false }
      - label: 'Photo'
        name: 'photo'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 500
          height: 500
          aspect_ratio: '1:1'
      - { label: 'Bio', name: 'bio', widget: 'markdown', required: false }

  - name: 'books'
    label: 'Books'
    label_singular: 'Book'
    description: >
      A collection of good books from all over the world
    folder: '_books'
    media_folder: 'assets/uploads/books'
    public_folder: '/assets/uploads/books'
    create: true
    summary: "{{title}} ({{published_date | date('YYYY')}}) — {{genre}}"
    sortable_fields: [title, published_date]
    view_filters:
      - { label: 'Magical Realism', field: genre, pattern: 'Magical Realism' }
      - { label: 'Historical Fiction', field: genre, pattern: 'Historical Fiction' }
      - { label: 'Dystopian', field: genre, pattern: 'Dystopian' }
    view_groups:
      - { label: 'Genre', field: genre }
      - { label: 'Author', field: author }
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - name: author
        label: 'Author'
        widget: relation
        collection: writers
        search_fields: ['name']
        display_fields: ['name']
        value_field: '{{slug}}'
      - { label: 'Published', name: 'published_date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - label: 'Genre'
        name: 'genre'
        widget: 'select'
        options:
          [
            'Literary Fiction',
            'Magical Realism',
            'Historical Fiction',
            'Science Fiction',
            'Fantasy',
            'Mystery',
            'Crime',
            'Romance',
            'Horror',
            'Dystopian',
            'Satire',
            'Poetry',
            'Drama',
            'Short Stories',
            'Philosophy',
            'Memoir',
            'Biography',
            'Epic',
            'Young Adult',
            'Essay',
          ]
      - label: 'ISBN'
        name: 'isbn'
        widget: 'string'
        required: false
        hint: 'ISBN-13, e.g. 978-0-14-243723-0'
        pattern:
          [
            '^97[89]-\\d{1,5}-\\d{1,7}-\\d{1,6}-\\d$',
            'Must look like an ISBN-13, e.g. 978-0-14-243723-0',
          ]
      - label: 'Cover Art'
        name: 'cover'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 800
          height: 1200
          aspect_ratio: '2:3'
      - { label: 'Table of Contents', name: 'table_of_contents', widget: 'list', required: false }

  - name: 'faq' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'FAQ' # Used in the UI
    label_singular: 'FAQ Item'
    description: >
      The multilingual collection. It inherits the global i18n block, structure
      single_file, so every locale of an answer lives in one file keyed by locale, and the
      editor shows one pane per locale side by side. Question and Answer are marked
      i18n: translate (edited per locale); Published is i18n: duplicate (set once, copied
      to every locale). The collection filter hides anything not published, so one draft
      answer in the seed data never appears in this list.
    folder: '_faqs'
    create: true # Allow users to create new documents in this collection
    i18n: true
    filter: { field: 'published', value: true }
    fields: # The fields each document in this collection have
      - { label: 'Question', name: 'title', widget: 'string', tagname: 'h1', i18n: translate }
      - { label: 'Published', name: 'published', widget: 'boolean', default: true, i18n: duplicate }
      - { label: 'Answer', name: 'body', widget: 'markdown', i18n: translate }

  - name: 'settings'
    label: 'Settings'
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: 'general'
        label: 'Site Settings'
        file: '_data/settings.json'
        description: 'General Site Settings'
        fields:
          - { label: 'Global title', name: 'site_title', widget: 'string' }
          - label: 'Post Settings'
            name: posts
            widget: 'object'
            fields:
              - {
                  label: 'Number of posts on frontpage',
                  name: front_limit,
                  widget: number,
                  min: 1,
                  max: 10,
                }
              - { label: 'Default Author', name: author, widget: string }
              - {
                  label: 'Default Thumbnail',
                  name: thumb,
                  widget: image,
                  class: 'thumb',
                  required: false,
                }

      - name: 'authors'
        label: 'Authors'
        file: '_data/authors.yml'
        description: 'Bylines available to blog posts'
        fields:
          - name: authors
            label: Authors
            label_singular: 'Author'
            widget: list
            fields:
              - { label: 'Name', name: 'name', widget: 'string', hint: 'First and Last' }
              - { label: 'Description', name: 'description', widget: 'markdown' }

  - name: 'kitchenSink' # all the things in one entry, for documentation and quick testing
    label: 'Kitchen Sink'
    folder: '_sink'
    create: true
    fields:
      - label: 'Related Post'
        name: 'post'
        widget: 'relationKitchenSinkPost'
        collection: 'posts'
        display_fields: ['title', 'datetime']
        search_fields: ['title', 'body']
        value_field: 'title'
      - { label: 'Title', name: 'title', widget: 'string' }
      - {
          label: 'ID',
          name: 'uuid',
          widget: 'uuid',
          read_only: true,
          prefix: '',
          use_b32_encoding: false,
        }
      - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: true }
      - { label: 'Map', name: 'map', widget: 'map' }
      - { label: 'Text', name: 'text', widget: 'text', hint: 'Plain text, not markdown' }
      - { label: 'Number', name: 'number', widget: 'number', hint: 'To infinity and beyond!' }
      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'File', name: 'file', widget: 'file' }
      - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - {
          label: 'Select multiple',
          name: 'select_multiple',
          widget: 'select',
          options: ['a', 'b', 'c'],
          multiple: true,
        }
      - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
      - { label: 'Color', name: 'color', widget: 'color' }
      - { label: 'Code', name: 'code', widget: 'code', default_language: 'yaml' }
      - label: 'Object'
        name: 'object'
        widget: 'object'
        collapsed: true
        fields:
          - label: 'Related Post'
            name: 'post'
            widget: 'relationKitchenSinkPost'
            collection: 'posts'
            search_fields: ['title', 'body']
            value_field: 'title'
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: false }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - label: 'List'
        name: 'list'
        widget: 'list'
        fields:
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
          - label: 'Object'
            name: 'object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - label: 'List'
                name: 'list'
                widget: 'list'
                fields:
                  - label: 'Related Post'
                    name: 'post'
                    widget: 'relationKitchenSinkPost'
                    collection: 'posts'
                    search_fields: ['title', 'body']
                    value_field: 'title'
                  - { label: 'String', name: 'string', widget: 'string' }
                  - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                  - { label: 'Text', name: 'text', widget: 'text' }
                  - { label: 'Number', name: 'number', widget: 'number' }
                  - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                  - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                  - { label: 'Image', name: 'image', widget: 'image' }
                  - { label: 'File', name: 'file', widget: 'file' }
                  - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
                  - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
                  - label: 'Object'
                    name: 'object'
                    widget: 'object'
                    fields:
                      - { label: 'String', name: 'string', widget: 'string' }
                      - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                      - { label: 'Text', name: 'text', widget: 'text' }
                      - { label: 'Number', name: 'number', widget: 'number' }
                      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                      - { label: 'Image', name: 'image', widget: 'image' }
                      - { label: 'File', name: 'file', widget: 'file' }
                      - {
                          label: 'Select',
                          name: 'select',
                          widget: 'select',
                          options: ['a', 'b', 'c'],
                        }
      - label: 'Typed List'
        name: 'typed_list'
        widget: 'list'
        types:
          - label: 'Type 1 Object'
            name: 'type_1_object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - label: 'Type 2 Object'
            name: 'type_2_object'
            widget: 'object'
            fields:
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - label: 'Type 3 Object'
            name: 'type_3_object'
            widget: 'object'
            fields:
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
  - name: pages # a nested collection
    label: Nested Pages
    label_singular: 'Page'
    description: >
      A nested collection: entries live in a folder tree and the sidebar mirrors that tree,
      and the meta.path option exposes the folder path as an editable field. Note that
      nested cannot be combined with the multiple_folders i18n structure: that structure
      reads the locale from the path segment just above the file, which only holds at
      depth 1. See FAQ for the i18n demo.
    folder: _pages
    create: true
    preview_path: 'pages/{{slug}}'
    preview_path_preserve_slashes: true
    nested: { depth: 100, subfolders: false }
    fields:
      - label: Title
        name: title
        widget: string
      - label: Body
        name: body
        widget: markdown
    meta: { path: { widget: string, label: 'Path' } }
