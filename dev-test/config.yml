backend:
  name: test-repo

site_url: https://example.com

publish_mode: editorial_workflow
media_folder: assets/uploads

i18n:
  structure: multiple_folders
  locales: [en, es, fr]
  default_locale: en

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 2000
  height: null
  aspect_ratio: null

logo:
  src: /nf-logo.png
  show_in_header: true

slug:
  encoding: unicode
  clean_accents: true

# Adds the Notes pane to the editor sidebar of every collection. Requires
# publish_mode: editorial_workflow and an existing (non-new) entry. On a real git
# backend each entry's notes are stored as comments on a GitHub/GitLab issue; the
# test-repo backend used by this demo keeps them in memory only, so nothing a
# visitor writes here leaves the browser or survives a reload.
editor:
  notes: true

collections: # A list of collections the CMS should be able to edit
  - name: 'posts' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'Posts' # Used in the UI
    label_singular: 'Post' # Used in the UI, ie: "New Post"
    description: >
      The description is a great place for tone setting, high level information, and editing
      guidelines that are specific to a collection.
    folder: '_posts'
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} -- {{year}}/{{month}}/{{day}}'
    create: true # Allow users to create new documents in this collection
    editor:
      visualEditing: true
    sortable_fields:
      - title
      - { field: date, default_sort: desc }
    view_filters:
      - label: Posts With Index
        field: title
        pattern: 'This is post #'
      - label: Posts Without Index
        field: title
        pattern: front matter post
      - label: Relation Test
        field: relation_test
        pattern: true
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
      - label: Relation Test
        field: relation_test
    fields: # The fields each document in this collection have
      - { label: 'Title', name: 'title', widget: 'string', tagname: 'h1' }
      - { label: 'Relation Test', name: 'relation_test', widget: 'hidden', default: true }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          format: 'YYYY-MM-DD HH:mm',
          default: '{{now}}',
        }
      - label: 'Cover Image'
        name: 'image'
        widget: 'image'
        required: false
        tagname: ''

      - { label: 'Body', name: 'body', widget: 'richtext', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold', widget: 'markdown', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold2', widget: 'markdown', hint: 'Main content goes here 2.' }

  - name: 'authors'
    label: 'Authors'
    label_singular: 'Author'
    description: >
      54 writers from 32 countries across every inhabited continent, referenced by Books
      below — demonstrates the relation widget's "many books to one author" side,
      identifier_field (entries are titled by "Name", not "Title"), and a square-cropped
      photo via media_processing.
    folder: '_authors'
    create: true
    identifier_field: name
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Country', name: 'country', widget: 'string', required: false }
      - { label: 'Born', name: 'born', widget: 'number', required: false }
      - label: 'Photo'
        name: 'photo'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 500
          height: 500
          aspect_ratio: '1:1'
      - { label: 'Bio', name: 'bio', widget: 'markdown', required: false }

  - name: 'books'
    label: 'Books'
    label_singular: 'Book'
    description: >
      57 novels, story and poetry collections, and one autobiography, spanning six
      continents and two centuries, seeded as sample data. Demonstrates the relation
      widget (Author), a per-collection media_folder/public_folder override,
      sortable_fields/view_filters/view_groups, a regex-validated field (ISBN), a summary
      string transform, a plain list widget (Table of Contents), and a media_processing
      override on the cover art (a portrait crop, unlike Authors' square one).
    folder: '_books'
    media_folder: 'assets/uploads/books'
    public_folder: '/assets/uploads/books'
    create: true
    summary: "{{title}} ({{published_date | date('YYYY')}}) — {{genre}}"
    sortable_fields: [title, published_date]
    view_filters:
      - { label: 'Magical Realism', field: genre, pattern: 'Magical Realism' }
      - { label: 'Historical Fiction', field: genre, pattern: 'Historical Fiction' }
      - { label: 'Dystopian', field: genre, pattern: 'Dystopian' }
    view_groups:
      - { label: 'Genre', field: genre }
      - { label: 'Author', field: author }
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - name: author
        label: 'Author'
        widget: relation
        collection: authors
        search_fields: ['name']
        display_fields: ['name']
        value_field: '{{slug}}'
      - { label: 'Published', name: 'published_date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - label: 'Genre'
        name: 'genre'
        widget: 'select'
        options:
          [
            'Literary Fiction',
            'Magical Realism',
            'Historical Fiction',
            'Science Fiction',
            'Fantasy',
            'Mystery',
            'Crime',
            'Romance',
            'Horror',
            'Dystopian',
            'Satire',
            'Poetry',
            'Drama',
            'Short Stories',
            'Philosophy',
            'Memoir',
            'Biography',
            'Epic',
            'Young Adult',
            'Essay',
          ]
      - label: 'ISBN'
        name: 'isbn'
        widget: 'string'
        required: false
        hint: 'ISBN-13, e.g. 978-0-14-243723-0'
        pattern:
          [
            '^97[89]-\\d{1,5}-\\d{1,7}-\\d{1,6}-\\d$',
            'Must look like an ISBN-13, e.g. 978-0-14-243723-0',
          ]
      - label: 'Cover Art'
        name: 'cover'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 800
          height: 1200
          aspect_ratio: '2:3'
      - { label: 'Table of Contents', name: 'table_of_contents', widget: 'list', required: false }

  - name: 'faq' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'FAQ' # Used in the UI
    folder: '_faqs'
    create: true # Allow users to create new documents in this collection
    fields: # The fields each document in this collection have
      - { label: 'Question', name: 'title', widget: 'string', tagname: 'h1' }
      - { label: 'Answer', name: 'body', widget: 'markdown' }

  - name: 'settings'
    label: 'Settings'
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: 'general'
        label: 'Site Settings'
        file: '_data/settings.json'
        description: 'General Site Settings'
        fields:
          - { label: 'Global title', name: 'site_title', widget: 'string' }
          - label: 'Post Settings'
            name: posts
            widget: 'object'
            fields:
              - {
                  label: 'Number of posts on frontpage',
                  name: front_limit,
                  widget: number,
                  min: 1,
                  max: 10,
                }
              - { label: 'Default Author', name: author, widget: string }
              - {
                  label: 'Default Thumbnail',
                  name: thumb,
                  widget: image,
                  class: 'thumb',
                  required: false,
                }

      - name: 'blog_authors'
        label: 'Blog Authors'
        file: '_data/blog_authors.yml'
        description: 'Author descriptions (distinct from the Authors collection, which is book authors)'
        fields:
          - name: authors
            label: Authors
            label_singular: 'Author'
            widget: list
            fields:
              - { label: 'Name', name: 'name', widget: 'string', hint: 'First and Last' }
              - { label: 'Description', name: 'description', widget: 'markdown' }

  - name: 'kitchenSink' # all the things in one entry, for documentation and quick testing
    label: 'Kitchen Sink'
    folder: '_sink'
    create: true
    fields:
      - label: 'Related Post'
        name: 'post'
        widget: 'relationKitchenSinkPost'
        collection: 'posts'
        display_fields: ['title', 'datetime']
        search_fields: ['title', 'body']
        value_field: 'title'
      - { label: 'Title', name: 'title', widget: 'string' }
      - {
          label: 'ID',
          name: 'uuid',
          widget: 'uuid',
          read_only: true,
          prefix: '',
          use_b32_encoding: false,
        }
      - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: true }
      - { label: 'Map', name: 'map', widget: 'map' }
      - { label: 'Text', name: 'text', widget: 'text', hint: 'Plain text, not markdown' }
      - { label: 'Number', name: 'number', widget: 'number', hint: 'To infinity and beyond!' }
      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'File', name: 'file', widget: 'file' }
      - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - {
          label: 'Select multiple',
          name: 'select_multiple',
          widget: 'select',
          options: ['a', 'b', 'c'],
          multiple: true,
        }
      - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
      - { label: 'Color', name: 'color', widget: 'color' }
      - { label: 'Code', name: 'code', widget: 'code', default_language: 'yaml' }
      - label: 'Object'
        name: 'object'
        widget: 'object'
        collapsed: true
        fields:
          - label: 'Related Post'
            name: 'post'
            widget: 'relationKitchenSinkPost'
            collection: 'posts'
            search_fields: ['title', 'body']
            value_field: 'title'
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: false }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - label: 'List'
        name: 'list'
        widget: 'list'
        fields:
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
          - label: 'Object'
            name: 'object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - label: 'List'
                name: 'list'
                widget: 'list'
                fields:
                  - label: 'Related Post'
                    name: 'post'
                    widget: 'relationKitchenSinkPost'
                    collection: 'posts'
                    search_fields: ['title', 'body']
                    value_field: 'title'
                  - { label: 'String', name: 'string', widget: 'string' }
                  - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                  - { label: 'Text', name: 'text', widget: 'text' }
                  - { label: 'Number', name: 'number', widget: 'number' }
                  - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                  - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                  - { label: 'Image', name: 'image', widget: 'image' }
                  - { label: 'File', name: 'file', widget: 'file' }
                  - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
                  - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
                  - label: 'Object'
                    name: 'object'
                    widget: 'object'
                    fields:
                      - { label: 'String', name: 'string', widget: 'string' }
                      - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                      - { label: 'Text', name: 'text', widget: 'text' }
                      - { label: 'Number', name: 'number', widget: 'number' }
                      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                      - { label: 'Image', name: 'image', widget: 'image' }
                      - { label: 'File', name: 'file', widget: 'file' }
                      - {
                          label: 'Select',
                          name: 'select',
                          widget: 'select',
                          options: ['a', 'b', 'c'],
                        }
      - label: 'Typed List'
        name: 'typed_list'
        widget: 'list'
        types:
          - label: 'Type 1 Object'
            name: 'type_1_object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - label: 'Type 2 Object'
            name: 'type_2_object'
            widget: 'object'
            fields:
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - label: 'Type 3 Object'
            name: 'type_3_object'
            widget: 'object'
            fields:
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
  - name: pages # a nested collection
    label: Pages
    label_singular: 'Page'
    description: >
      A nested collection: entries live in a folder tree and the sidebar mirrors that tree.
      The meta.path option exposes the folder path as an editable field. This collection is
      deliberately not translated — multiple_folders reads the locale from the path segment
      just above the file, which only holds at depth 1, so it cannot be combined with nested.
      See Localized Pages for the multiple_folders demo.
    folder: _pages
    create: true
    preview_path: 'pages/{{slug}}'
    preview_path_preserve_slashes: true
    nested: { depth: 100, subfolders: false }
    fields:
      - label: Title
        name: title
        widget: string
      - label: Body
        name: body
        widget: markdown
    meta: { path: { widget: string, label: 'Path' } }

  - name: 'localized_pages'
    label: 'Localized Pages'
    label_singular: 'Localized Page'
    description: >
      Inherits the global i18n block, structure multiple_folders, so every locale is a
      separate file under _localized/<locale>/. The editor shows one pane per locale side by
      side. Fields marked i18n: translate are edited per locale; fields marked i18n: duplicate
      are copied from the default locale and locked in the others (see Slug).
    folder: '_localized'
    create: true
    i18n: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string', i18n: translate }
      - { label: 'Slug', name: 'ref', widget: 'string', i18n: duplicate }
      - { label: 'Body', name: 'body', widget: 'markdown', i18n: translate }

  - name: 'i18n_posts' # a single file i18n collection with a filter
    label: 'i18n Posts'
    label_singular: 'i18n Post'
    description: >
      Entries of this collection keep every locale in a single file. The collection filter
      hides the drafted entry, so only the two published ones should be listed.
    folder: '_i18n_posts'
    create: true
    # Overrides the global i18n block, which uses multiple_folders
    i18n:
      structure: single_file
      locales: [en, de]
      default_locale: en
    filter: { field: 'draft', value: false }
    fields:
      - { label: 'Title', name: 'title', widget: 'string', i18n: true }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false, i18n: duplicate }
      - { label: 'Body', name: 'body', widget: 'markdown', i18n: true }
