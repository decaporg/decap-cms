backend:
  name: test-repo

site_url: https://example.com

publish_mode: editorial_workflow
media_folder: assets/uploads

i18n:
  structure: multiple_folders
  locales: [en, es, fr]
  default_locale: en

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 2000
  height: null
  aspect_ratio: null

logo:
  src: /nf-logo.png
  show_in_header: true

slug:
  encoding: unicode
  clean_accents: true

collections: # A list of collections the CMS should be able to edit
  - name: 'posts' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'Posts' # Used in the UI
    label_singular: 'Post' # Used in the UI, ie: "New Post"
    description: >
      The description is a great place for tone setting, high level information, and editing
      guidelines that are specific to a collection.
    folder: '_posts'
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} -- {{year}}/{{month}}/{{day}}'
    create: true # Allow users to create new documents in this collection
    editor:
      visualEditing: true
    sortable_fields:
      - title
      - { field: date, default_sort: desc }
    view_filters:
      - label: Posts With Index
        field: title
        pattern: 'This is post #'
      - label: Posts Without Index
        field: title
        pattern: front matter post
      - label: Relation Test
        field: relation_test
        pattern: true
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
      - label: Relation Test
        field: relation_test
    fields: # The fields each document in this collection have
      - { label: 'Title', name: 'title', widget: 'string', tagname: 'h1' }
      - { label: 'Relation Test', name: 'relation_test', widget: 'hidden', default: true }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          format: 'YYYY-MM-DD HH:mm',
          default: '{{now}}',
        }
      - label: 'Cover Image'
        name: 'image'
        widget: 'image'
        required: false
        tagname: ''

      - { label: 'Body', name: 'body', widget: 'richtext', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold', widget: 'markdown', hint: 'Main content goes here.' }
      - { label: 'Body', name: 'bodyold2', widget: 'markdown', hint: 'Main content goes here 2.' }

  - name: 'artists'
    label: 'Artists'
    label_singular: 'Artist'
    description: >
      Bands and musicians referenced by Albums below — demonstrates the relation widget's
      "many albums to one artist" side, identifier_field (entries are titled by "Name", not
      "Title"), and a square-cropped photo via media_processing.
    folder: '_artists'
    create: true
    identifier_field: name
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Country', name: 'country', widget: 'string', required: false }
      - { label: 'Formed', name: 'formed_year', widget: 'number', required: false }
      - label: 'Photo'
        name: 'photo'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 500
          height: 500
          aspect_ratio: '1:1'
      - { label: 'Bio', name: 'bio', widget: 'markdown', required: false }

  - name: 'albums'
    label: 'Albums'
    label_singular: 'Album'
    description: >
      55 landmark metal albums (10 per decade, 1970s-2010s, plus 5 so far from the 2020s),
      seeded as sample data. Demonstrates the relation widget (Artist), a per-collection
      media_folder/public_folder override, sortable_fields/view_filters/view_groups, a
      regex-validated field (Catalog Number), a summary string transform, a plain list
      widget (Tracklist), and a media_processing override on the cover art.
    folder: '_albums'
    media_folder: 'assets/uploads/albums'
    public_folder: '/assets/uploads/albums'
    create: true
    summary: "{{title}} ({{release_date | date('YYYY')}}) — {{genre}}"
    sortable_fields: [title, release_date]
    view_filters:
      - { label: 'Thrash Metal', field: genre, pattern: 'Thrash Metal' }
      - { label: 'Death Metal', field: genre, pattern: 'Death Metal' }
      - { label: 'Black Metal', field: genre, pattern: 'Black Metal' }
    view_groups:
      - { label: 'Genre', field: genre }
      - { label: 'Artist', field: artist }
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - name: artist
        label: 'Artist'
        widget: relation
        collection: artists
        search_fields: ['name']
        display_fields: ['name']
        value_field: '{{slug}}'
      - { label: 'Release Date', name: 'release_date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - label: 'Genre'
        name: 'genre'
        widget: 'select'
        options:
          [
            'Heavy Metal', 'Hard Rock', 'Progressive Rock', 'Thrash Metal', 'Black Metal',
            'Death Metal', 'Melodic Death Metal', 'Groove Metal', 'Power Metal', 'Gothic Metal',
            'Industrial Metal', 'Symphonic Metal', 'Symphonic Black Metal', 'Blackened Death Metal',
            'Progressive Metal', 'Blackgaze', 'Sludge Metal', 'Kawaii Metal', 'Grindcore', 'Deathcore',
          ]
      - label: 'Catalog Number'
        name: 'catalog_number'
        widget: 'string'
        required: false
        hint: 'Record-label catalog number, e.g. SST-027'
        pattern: ['^[A-Z0-9]{2,6}-\d{2,6}$', 'Must look like a catalog number, e.g. SST-027']
      - label: 'Cover Art'
        name: 'cover'
        widget: 'image'
        required: false
        media_processing:
          enabled: true
          format: { enabled: true, default: webp }
          quality: 85
          width: 1000
          height: 1000
          aspect_ratio: '1:1'
      - { label: 'Tracklist', name: 'tracklist', widget: 'list', required: false }

  - name: 'faq' # Used in routes, ie.: /admin/collections/:slug/edit
    label: 'FAQ' # Used in the UI
    folder: '_faqs'
    create: true # Allow users to create new documents in this collection
    fields: # The fields each document in this collection have
      - { label: 'Question', name: 'title', widget: 'string', tagname: 'h1' }
      - { label: 'Answer', name: 'body', widget: 'markdown' }

  - name: 'settings'
    label: 'Settings'
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: 'general'
        label: 'Site Settings'
        file: '_data/settings.json'
        description: 'General Site Settings'
        fields:
          - { label: 'Global title', name: 'site_title', widget: 'string' }
          - label: 'Post Settings'
            name: posts
            widget: 'object'
            fields:
              - {
                  label: 'Number of posts on frontpage',
                  name: front_limit,
                  widget: number,
                  min: 1,
                  max: 10,
                }
              - { label: 'Default Author', name: author, widget: string }
              - {
                  label: 'Default Thumbnail',
                  name: thumb,
                  widget: image,
                  class: 'thumb',
                  required: false,
                }

      - name: 'authors'
        label: 'Authors'
        file: '_data/authors.yml'
        description: 'Author descriptions'
        fields:
          - name: authors
            label: Authors
            label_singular: 'Author'
            widget: list
            fields:
              - { label: 'Name', name: 'name', widget: 'string', hint: 'First and Last' }
              - { label: 'Description', name: 'description', widget: 'markdown' }

  - name: 'kitchenSink' # all the things in one entry, for documentation and quick testing
    label: 'Kitchen Sink'
    folder: '_sink'
    create: true
    fields:
      - label: 'Related Post'
        name: 'post'
        widget: 'relationKitchenSinkPost'
        collection: 'posts'
        display_fields: ['title', 'datetime']
        search_fields: ['title', 'body']
        value_field: 'title'
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'ID', name: 'uuid', widget: 'uuid', read_only: true, prefix: '', use_b32_encoding: false }
      - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: true }
      - { label: 'Map', name: 'map', widget: 'map' }
      - { label: 'Text', name: 'text', widget: 'text', hint: 'Plain text, not markdown' }
      - { label: 'Number', name: 'number', widget: 'number', hint: 'To infinity and beyond!' }
      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'File', name: 'file', widget: 'file' }
      - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - {
          label: 'Select multiple',
          name: 'select_multiple',
          widget: 'select',
          options: ['a', 'b', 'c'],
          multiple: true,
        }
      - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
      - { label: 'Color', name: 'color', widget: 'color' }
      - { label: 'Code', name: 'code', widget: 'code', default_language: 'yaml' }
      - label: 'Object'
        name: 'object'
        widget: 'object'
        collapsed: true
        fields:
          - label: 'Related Post'
            name: 'post'
            widget: 'relationKitchenSinkPost'
            collection: 'posts'
            search_fields: ['title', 'body']
            value_field: 'title'
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean', default: false }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
      - label: 'List'
        name: 'list'
        widget: 'list'
        fields:
          - { label: 'String', name: 'string', widget: 'string' }
          - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Number', name: 'number', widget: 'number' }
          - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'File', name: 'file', widget: 'file' }
          - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
          - label: 'Object'
            name: 'object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - label: 'List'
                name: 'list'
                widget: 'list'
                fields:
                  - label: 'Related Post'
                    name: 'post'
                    widget: 'relationKitchenSinkPost'
                    collection: 'posts'
                    search_fields: ['title', 'body']
                    value_field: 'title'
                  - { label: 'String', name: 'string', widget: 'string' }
                  - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                  - { label: 'Text', name: 'text', widget: 'text' }
                  - { label: 'Number', name: 'number', widget: 'number' }
                  - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                  - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                  - { label: 'Image', name: 'image', widget: 'image' }
                  - { label: 'File', name: 'file', widget: 'file' }
                  - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
                  - { label: 'Hidden', name: 'hidden', widget: 'hidden', default: 'hidden' }
                  - label: 'Object'
                    name: 'object'
                    widget: 'object'
                    fields:
                      - { label: 'String', name: 'string', widget: 'string' }
                      - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
                      - { label: 'Text', name: 'text', widget: 'text' }
                      - { label: 'Number', name: 'number', widget: 'number' }
                      - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
                      - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
                      - { label: 'Image', name: 'image', widget: 'image' }
                      - { label: 'File', name: 'file', widget: 'file' }
                      - {
                          label: 'Select',
                          name: 'select',
                          widget: 'select',
                          options: ['a', 'b', 'c'],
                        }
      - label: 'Typed List'
        name: 'typed_list'
        widget: 'list'
        types:
          - label: 'Type 1 Object'
            name: 'type_1_object'
            widget: 'object'
            fields:
              - { label: 'String', name: 'string', widget: 'string' }
              - { label: 'Boolean', name: 'boolean', widget: 'boolean' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - label: 'Type 2 Object'
            name: 'type_2_object'
            widget: 'object'
            fields:
              - { label: 'Number', name: 'number', widget: 'number' }
              - { label: 'Select', name: 'select', widget: 'select', options: ['a', 'b', 'c'] }
              - { label: 'Datetime', name: 'datetime', widget: 'datetime' }
              - { label: 'Markdown', name: 'markdown', widget: 'markdown' }
          - label: 'Type 3 Object'
            name: 'type_3_object'
            widget: 'object'
            fields:
              - { label: 'Image', name: 'image', widget: 'image' }
              - { label: 'File', name: 'file', widget: 'file' }
  - name: pages # a nested collection
    label: Pages
    label_singular: 'Page'
    folder: _pages
    create: true
    preview_path: 'pages/{{slug}}'
    preview_path_preserve_slashes: true
    nested: { depth: 100, subfolders: false }
    i18n: true
    fields:
      - label: Title
        name: title
        widget: string
        i18n: translate
      - label: Body
        name: body
        widget: markdown
        i18n: translate
    meta: { path: { widget: string, label: 'Path' } }
