              '---\ntitle: "Modelling content with collections"\ndate: 2026-08-18T09:00:00.000Z\ncategory: "Tutorial"\nfeatured: true\n---\n\nA collection is the unit Decap works in. Each one points at a folder or a set of files in your repository, and declares the fields an entry may contain.\n\nStart from the shape of the content, not the shape of the page. A collection whose fields mirror one template tends to stop working the moment a second template needs the same content.\n',

          '2024-10-08-git-is-a-strange-database-and-that-is-the-point.md': {
            content:
              '---\ntitle: "Git is a strange database, and that is the point"\ndate: 2024-10-08T09:00:00.000Z\ncategory: "Opinion"\nfeatured: false\n---\n\nContent in a Git repository gets history, branching, review and rollback for free, because those are the things Git already does.\n\nWhat you give up is querying. If you need to ask arbitrary questions of your content at runtime, a repository is the wrong store, and that is a reasonable reason not to use a Git-backed CMS.\n',

his object lives inside a list item, and holds another list of its own.\n      number: 2\n      markdown: Nesting is how you model repeatable page sections.\n      datetime: 2026-03-01T09:30:00.000Z\n      select: b\n      list:\n        - string: A list inside an object inside a list.\n          boolean: true\n          text: Decap does not limit the nesting depth.\n          number: 3\n          markdown: Keep it shallow anyway. Editors have to navigate this.\n          datetime: 2026-03-01T09:30:00.000Z\n          select: c\n          hidden: hidden\n  - string: A second list item, to show reordering.\n    boolean: false\n    text: Remove it with the trash icon on the right of its header.\n    number: 4\n    markdown: The **+** button at the bottom adds another.\n    datetime: 2026-03-02T09:30:00.000Z\n    select: b\ntyped_list:\n  - type: type_1_object\n    string: A typed list lets one list hold several different shapes.\n    boolean: true\n    text: >-\n      Each item declares its type, and Decap renders the fields for that type only. This is\n      how you build a flexible page-section builder.\n  - type: type_2_object\n    number: 7\n    select: c\n    datetime: 2026-03-03T09:30:00.000Z\n    markdown: This item is a different type from the one above, in the same list.\n---\n\n# Every widget, explained\n\nThis entry exists so you can see every built-in widget at once, with real values instead of\nplaceholder text. Each field\'s value describes the widget that holds it.\n\nA few things worth noticing:\n\n- **Related Post** at the top is a custom widget. It reuses the built-in relation control\n  but supplies its own preview, registered with `CMS.registerWidget`.\n- **ID** is a uuid widget marked `read_only`, so it is generated rather than typed.\n- **Hidden** does not render in the editor at all. It is in the file, not on the screen.\n- **Object** and **List** nest, and this entry nests them several levels deep on purpose.\n\nOpen the preview pane to see how   <body>
    <script src="dist/decap-cms.js"></script>
    <script>
      var PostPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          return h(
            'div',
            {},
            h(
              'div',
              { className: 'cover' },
              h('h1', {}, entry.getIn(['data', 'title'])),
              this.props.widgetFor('image'),
            ),
            h('p', {}, h('small', {}, 'Written ' + entry.getIn(['data', 'date']))),
            h('h2', {}, 'Richtext Widget'),
            h('div', { className: 'text' }, this.props.widgetFor('body')),
            h('h2', {}, 'Markdown Widget'),
            h('div', { className: 'text' }, this.props.widgetFor('bodyold')),
          );
        },
      });

      var GeneralPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'site_title']);
          var posts = entry.getIn(['data', 'posts']);
          var thumb = posts && posts.get('thumb');

          return h(
            'div',
            {},
            h('h1', {}, title),
            h(
              'dl',
              {},
              h('dt', {}, 'Posts on Frontpage'),
              h('dd', {}, this.props.widgetsFor('posts').getIn(['widgets', 'front_limit']) || 0),

              h('dt', {}, 'Default Author'),
              h('dd', {}, this.props.widgetsFor('posts').getIn(['data', 'author']) || 'None'),

              h('dt', {}, 'Default Thumbnail'),
              h('dd', {}, thumb && h('img', { src: this.props.getAsset(thumb).toString() })),
            ),
          );
        },
      });

      var AuthorsPreview = createClass({
        render: function () {
          return h(
            'div',
            {},
            h('h1', {}, 'Authors'),
            this.props.widgetsFor('authors').map(function (author, index) {
              return h(
                'div',
                { key: index },
                h('hr', {}),
                h('strong', {}, author.getIn(['data', 'name'])),
                author.getIn(['widgets', 'description']),
              );
            }),
          );
        },
      });

      const RelationKitchenSinkPostPreview = createClass({
        render: function () {
          // When a post is selected from the relation field, all of it's data
          // will be available in the field's metadata nested under the collection
          // name, and then further nested under the value specified in `value_field`.
          // In this case, the post would be nested under "posts" and then under
          // the title of the selected post, since our `value_field` in the config
          // is "title".
          const { value, fieldsMetaData } = this.props;
          const post = fieldsMetaData && fieldsMetaData.getIn(['posts', value]);
          const style = { border: '2px solid #ccc', borderRadius: '8px', padding: '20px' };
          return post
            ? h(
                'div',
                { style: style },
                h('h2', {}, 'Related Post'),
                h('h3', {}, post.get('title')),
                h('img', { src: post.get('image') }),
                h('p', {}, post.get('body', '').slice(0, 100) + '...'),
              )
            : null;
        },
      });

      const previewStyles = `
      html,
      body {
        color: #444;
        font-size: 14px;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      body {
        padding: 20px;
      }

      h1 {
        margin-top: 20px;
        color: #666;
        font-weight: bold;
        font-size: 32px;
      }

      img {
        max-width: 100%;
      }
    `;

      CMS.registerPreviewTemplate('posts', PostPreview);
      CMS.registerPreviewTemplate('general', GeneralPreview);
      CMS.registerPreviewTemplate('authors', AuthorsPreview);
      CMS.registerPreviewStyle(previewStyles, { raw: true });
      // Pass the name of a registered control to reuse with a new widget preview.
      CMS.registerWidget('relationKitchenSinkPost', 'relation', RelationKitchenSinkPostPreview);
      CMS.registerEditorComponent({
        id: 'youtube',
        label: 'Youtube',
        fields: [{ name: 'id', label: 'Youtube Video ID' }],
        pattern: /^{{<\s?youtube (\S+)\s?>}}/,
        fromBlock: function (match) {
          return {
            id: match[1],
          };
        },
        toBlock: function (obj) {
          return '{{< youtube ' + obj.id + ' >}}';
        },
        toPreview: function (obj) {
          return (
            '<img src="http://img.youtube.com/vi/' +
            obj.id +
            '/maxresdefault.jpg" alt="Youtube Video"/>'
          );
        },
      });
      CMS.registerEditorComponent({
        id: 'container-markdown',
        label: 'Container Markdown',
        fields: [{ name: 'inner', label: 'Body', widget: 'markdown', editor_components: [] }],
        pattern: /^{{< container-markdown >}}(.*?){{< \/container-markdown >}}/s,
        fromBlock(match) {
          return {
            inner: match[1] || '',
          };
        },
        toBlock(obj) {
          return `{{< container-markdown >}}${obj.inner}{{< /container-markdown >}}`;
        },
      });
      CMS.registerEditorComponent({
        id: 'container-richtext',
        label: 'Container Richtext',
        fields: [
          {
            name: 'inner',
            label: 'Body',
            widget: 'richtext',
            editor_components: ['container-richtext'],
          },
        ],
        pattern: /^{{< container-richtext >}}(.*?){{< \/container-richtext >}}/s,
        fromBlock(match) {
          return {
            inner: match[1] || '',
          };
        },
        toBlock(obj) {
          return `{{< container-richtext >}}${obj.inner}{{< /container-richtext >}}`;
        },
      });
      CMS.registerEditorComponent({
        id: 'wikilink',
        label: 'Wikilink',
        type: 'inline',
        trigger: '[',
        pattern: /\[\[(?<target>[^\]]+)\]\]/,
        fromInline: match => ({ target: match.groups.target }),
        toInline: data => `[[${data.target}]]`,
        toPreview: data => `🔗 [[${data.target || 'link'}]]`,
        onInsert: async ({ selectedText }) => {
          const target = prompt('Enter link target:', selectedText);
          return target ? { target } : null;
        },
        onEdit: async ({ data }) => {
          const target = prompt('Edit link target:', data.target);
          return target ? { target } : null;
        },
      });
    </script>
  </body>
