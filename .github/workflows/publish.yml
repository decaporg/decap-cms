name: Publish Packages

on:
  push:
    tags:
      - 'decap-*@*'

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishers

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production  # Optional: adds approval requirements and deployment protection
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Lerna to detect changes

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci

      - name: Test package integrity
        run: pnpm run test:package-integrity

      - name: Debug
        run: |
          echo "::group::Node & npm versions"
          node -v
          npm -v
          pnpm -v
          echo "::endgroup::"

          echo "::group::npm config (redacted)"
          npm config get registry || true
          npm config list -l | sed 's/_authToken.*/_authToken=[REDACTED]/' || true
          echo "::endgroup::"

          echo "::group::Env checks"
          if [ -n "${NODE_AUTH_TOKEN}" ]; then echo "NODE_AUTH_TOKEN set? yes"; else echo "NODE_AUTH_TOKEN set? no"; fi
          if [ -n "${NPM_CONFIG_USERCONFIG}" ]; then echo "NPM_CONFIG_USERCONFIG set? yes"; else echo "NPM_CONFIG_USERCONFIG set? no"; fi
          echo "::endgroup::"

          echo "::group::Git state"
          git status --porcelain || true
          git tag --list --points-at HEAD || true
          echo "::endgroup::"

          echo "::group::Registry package info"
          npm view decap-server version || true
          npm view decap-server versions --json || true
          echo "::endgroup::"

          echo "::group::Lerna packages"
          pnpm exec lerna ls --json || true
          echo "::endgroup::"

      - name: Publish to npm
        # The OIDC token exchange fails intermittently (ERR_PNPM_AUTH_TOKEN_EXCHANGE),
        # which used to leave the release half-published until a maintainer noticed
        # and re-ran the workflow by hand. `pnpm publish -r` skips versions that are
        # already on the registry, so retrying is safe and resumes where it stopped.
        # No NODE_AUTH_TOKEN needed - uses OIDC automatically via trusted publishers
        run: |
          for attempt in 1 2 3; do
            echo "::group::Publish attempt $attempt"
            if pnpm run publish:packages -- --provenance; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Publish attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::pnpm publish failed after 3 attempts"
          exit 1

      # Must run after publishing: a pre-publish check only sees what the correct
      # publish client produces, so it cannot catch a release uploaded by a client
      # that does not understand `catalog:`. See issue #7979.
      - name: Verify published manifests
        run: pnpm run verify:published
